<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موقع تقييم أمناء العضوية والمراكز - البحيرة | حزب حماة الوطن</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14171f;--pri:#a4111f;--pt:#a4111f;--gold:#c99a1b;--bg:#f2f3f5;--card:#fff;--line:#dfe2e7;--tx:#161a22;--mut:#5d6573;--track:#e8eaee;--bad:#b3261e;--wb:#fff7e0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b24;--line:#2a303c;--tx:#eceef2;--mut:#9aa3b2;--track:#262c38;--pri:#c42335;--pt:#ff7886;--bad:#ff8a80;--wb:#2b2410}}
*{box-sizing:border-box}[hidden]{display:none!important}
[hidden]{display:none!important}
body{margin:0;font:400 16px/1.7 "IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.top{background:var(--ink);color:#fff;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}
.top .in{max-width:1300px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.top img{width:48px;height:48px;border-radius:50%;background:#fff}
.ttl{flex:1;line-height:1.35}.ttl small{color:#ffffffb3;font-size:.8rem}.ttl h1{margin:0;font-size:1.1rem;font-weight:700}
.who{font-size:.85rem;color:#ffffffcc}
main{flex:1;padding:24px 16px 40px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:16px;border-top:1px solid var(--line)}
.wrap{max-width:920px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.wide{max-width:1300px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card h3{margin:0;font-size:1.05rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:8px 16px;background:var(--pri);color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:filter .15s}
button:hover{filter:brightness(1.12)}button:disabled{opacity:.6;cursor:wait}
button.g{background:transparent;border-color:var(--line);color:var(--tx)}button.g:hover{background:var(--track);filter:none}
.top button.g{color:#fff;border-color:#ffffff55}.top button.g:hover{background:#ffffff1f}
button.ic{padding:6px 8px}button.dg:hover{color:var(--bad);border-color:var(--bad)}
input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input:hover,textarea:hover{border-color:var(--mut)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:5px;font-weight:600;font-size:.9rem}
.mut{color:var(--mut);margin:0}.err{color:var(--bad);min-height:1.5em;margin:0;font-size:.9rem}
.msg{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--gold);border-radius:8px;padding:12px 16px}.msg.warn{background:var(--wb)}
.auth{display:grid;grid-template-columns:1fr 1fr;max-width:860px;margin:28px auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.auth aside{background:var(--ink);color:#fff;padding:40px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-inline-end:3px solid var(--gold)}
.auth aside img{width:104px;height:104px;border-radius:50%;background:#fff}
.auth aside h2{margin:6px 0 0;font-size:1.6rem;line-height:1.3}.auth aside p{margin:0;color:#ffffffb8}
.auth .fm{padding:40px 32px;display:grid;gap:14px;align-content:center}.auth .fm h2{margin:0}
@media(max-width:700px){.auth{grid-template-columns:1fr}.auth aside{padding:28px;border:0;border-bottom:3px solid var(--gold)}.auth .fm{padding:28px}}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:24px 28px}
.ring{--p:0;width:140px;aspect-ratio:1;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center}
.ring::before{content:"";grid-area:1/1;width:calc(100% - 22px);height:calc(100% - 22px);border-radius:50%;background:var(--card)}
.ring b{grid-area:1/1;position:relative;text-align:center;font-size:2.2rem;line-height:1.1}.ring small{display:block;font-size:.8rem;font-weight:400;color:var(--mut)}
.hero .id{flex:1;min-width:200px}.hero h2{margin:0;font-size:1.7rem;line-height:1.3}
.kp{display:flex;gap:12px;margin:0}.kp div{border:1px solid var(--line);border-radius:8px;padding:10px 20px;text-align:center}
.kp dt{font-size:.8rem;color:var(--mut)}.kp dd{margin:0;font-size:1.7rem;font-weight:700;color:var(--pt)}.kp small{font-size:.8rem;font-weight:400;color:var(--mut)}
.row{display:grid;grid-template-columns:250px 1fr 80px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row b{text-align:left}
.bar{height:8px;background:var(--track);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}.bar i.full{background:var(--gold)}
@media(max-width:560px){.row{grid-template-columns:1fr auto}.row .bar{grid-column:1/-1;order:3}.kp{width:100%}.kp div{flex:1}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpis .card{padding:14px 18px}
.kpis span{color:var(--mut);font-size:.85rem}.kpis b{display:block;font-size:1.7rem;color:var(--pt)}.kpis small{font-size:.85rem;font-weight:400;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tools input[type=search]{max-width:240px}
.tw{overflow:auto;max-height:75vh;margin-top:14px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;background:var(--card)}
th{background:var(--ink);color:#fff;font-weight:600;position:sticky;top:0;z-index:2}
th:not(.c1):not(.c2){white-space:normal;min-width:100px;line-height:1.4}th small{font-weight:400;color:#ffffffb3}
tbody tr:hover td{background:var(--track)}
.c1{right:0;width:44px;min-width:44px;max-width:44px}.c2{right:44px;box-shadow:-1px 0 0 var(--line)}
td.c1,td.c2,th.c1,th.c2{position:sticky}td.c1,td.c2{z-index:1}th.c1,th.c2{z-index:3}
td.nm{text-align:right;min-width:180px;font-weight:600}td.nm small{display:block;font-weight:400;color:var(--mut)}
td input{width:62px;text-align:center;padding:5px;-moz-appearance:textfield}td input.note{width:160px;text-align:right}
input::-webkit-inner-spin-button{appearance:none}
.tt{font-weight:700;color:var(--pt)}.act{display:flex;gap:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.cols,.kpis{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:20px;padding:3px 6px 3px 14px;background:var(--bg)}
.chip button{padding:2px 6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);max-width:540px;width:92%}
dialog:not([open]){display:none}dialog[open]{position:fixed;inset:0;margin:auto;height:fit-content;max-height:92vh;overflow:auto;z-index:60}
@media(max-width:720px){td.nm{min-width:130px}}
dialog textarea{height:150px;direction:ltr;font:.85rem monospace}
#toast{position:fixed;bottom:18px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;border-bottom:3px solid var(--gold);z-index:50}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top{position:static}.top button,.who,footer,.hero button{display:none}body{background:#fff}}
.brand{display:flex;align-items:center;gap:14px;flex:1;color:inherit;text-decoration:none}
.top #li{background:var(--gold);color:#14171f}
body[data-pg=home] main{padding:0}
.hero2{background:var(--ink);color:#fff;padding:56px 20px 64px;border-bottom:3px solid var(--gold)}
.hero2 h2{margin:0 auto 12px;max-width:900px;text-align:center;font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.3}
.hero2 p{margin:0 auto 38px;text-align:center;color:#ffffffb8}
.team{direction:ltr;display:grid;grid-template-columns:1.3fr 1.05fr .8fr;gap:22px;align-items:end;max-width:1020px;margin:0 auto}
.pc{position:relative;margin:0;aspect-ratio:4/5;overflow:hidden;border-radius:10px;background:#1d222c;direction:rtl}
.pc img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.pc figcaption{position:absolute;inset:auto 0 0;padding:60px 14px 16px;background:linear-gradient(transparent,#0b0d12ee 62%);border-bottom:4px solid var(--gold);transform:translateY(101%);transition:transform .35s ease;text-align:center}
.pc figcaption b{display:block;font-size:1.15rem;line-height:1.45}.pc figcaption span{color:#e3b53c;font-size:.92rem}
.pc:hover figcaption,.pc:focus figcaption{transform:none}.pc:hover img,.pc:focus img{transform:scale(1.04)}
.pc:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(hover:none){.pc figcaption{transform:none}.hero2 .hv{display:none}.hero2 h2{margin-bottom:36px}}
@media(max-width:720px){.team{grid-template-columns:1fr;max-width:340px}.pc:nth-child(2){width:90%;justify-self:center}.pc:nth-child(3){width:80%;justify-self:center}.top #li{padding:8px 12px}}
.band{max-width:1020px;margin:0 auto;padding:28px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}.band p{margin:0;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;color:var(--tx);padding:10px 8px}.seg button.on{background:var(--pri);color:#fff}
@media(max-width:720px){.who{display:none}}
</style>
</head>

<header class="top"><div class="in"><a class="brand" href="#" onclick="showHome();return false" aria-label="الرئيسية"><img id="hl" alt="شعار حزب حماة الوطن"><div class="ttl"><small>حزب حماة الوطن</small><h1>تقييم أمناء العضوية والمراكز - البحيرة</h1></div></a><span id="who" class="who"></span><button id="li" onclick="showLogin()">تسجيل الدخول</button><button id="out" class="g" hidden onclick="logout()">تسجيل الخروج</button></div></header>
<main id="app"></main>
<footer>حزب حماة الوطن - أمانة شئون العضوية</footer>
<div id="toast" role="status" hidden></div>
<dialog id="dlg">
<h3 style="margin-top:0">بيانات الدخول</h3>
<p class="mut">كل سطر: الاسم، رقم التسجيل، كلمة المرور. انسخها الآن وأرسلها لكل أمين، فكلمة المرور لا تظهر مرة أخرى (يمكنك توليد كلمة جديدة بزر 🔑).</p>
<textarea id="dc" readonly></textarea>
<p id="ds" class="mut" role="status" aria-live="polite" style="margin:8px 0 0"></p>
<p class="tools"><button id="cp" onclick="copyCreds(this)">نسخ</button><button class="g" onclick="closeD()">إغلاق</button></p>
</dialog>

const homeView=()=>`<section class="hero2"><h2>قيادات الحزب بالمحافظة</h2><p class="hv">مرّر المؤشر على أي صورة لمعرفة الاسم والمنصب.</p>

<div class="band"><p>سجّل الدخول للاطلاع على درجاتك في بنود التقييم.</p><div class="tools"><button onclick="showLogin('m')">دخول أمناء العضوية</button><button onclick="showLogin('c')">دخول أمناء المراكز</button></div></div>`;
function showLogin(t){if(t)LT=t;PG='login';ERR='';try{history.pushState(null,'','#login')}catch(e){}render();scrollTo(0,0);const u=$('#u');u&&u.focus()}
function setLT(t){const u=$('#u').value,p=$('#p').value;LT=t;ERR='';try{localStorage.setItem('ha_t',t)}catch(e){}render();$('#u').value=u;$('#p').value=p;$('#u').focus()}
function showHome(){PG='home';ERR='';try{history.pushState(null,'','#')}catch(e){}render();scrollTo(0,0)}
addEventListener('popstate',()=>{PG=location.hash==='#login'?'login':'home';render()});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nd=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const H=async p=>{if(!(window.crypto&&crypto.subtle))return'p:'+p;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bt:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const pw=()=>{const a='abcdefghjkmnpqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint8Array(7)),x=>a[x%a.length]).join('')};
const newId=()=>{let i;do i=String(10000+Math.floor(Math.random()*90000));while(DB.members.some(m=>m.id===i));return i};
const fm=id=>DB.members.find(m=>m.id===id);
const tot=m=>m.s.some(v=>v!=null)?Math.round(m.s.reduce((a,v)=>a+(+v||0),0)*100)/100:null;
const gpa=t=>(Math.round(t/MAXT*500)/100).toFixed(2);
/* الترتيب: المجاميع المتساوية تأخذ نفس الترتيب، والمجموع الذي يليها يأخذ الرقم التالي مباشرة (1،2،2،3،4...) */
const rank=m=>{const t=tot(m);return t==null?'':1+new Set(DB.members.map(tot).filter(x=>x!=null&&x>t)).size};
const byName=(a,b)=>a.n.localeCompare(b.n,'ar',{sensitivity:'base',numeric:true})||a.id.localeCompare(b.id);
const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t.k);t.k=setTimeout(()=>t.hidden=true,3500)};

/* ضبط طول مصفوفة الدرجات مع عدد البنود وعدم تجاوز الدرجة القصوى */
const cur=()=>S?S.t:LT;
function use(t){TK=t;DB=ALL[t];CRIT=TRK[t].crit;MAXT=CRIT.reduce((a,c)=>a+c[1],0)}
function load(d){const o=d&&d.m?d:{m:d||{},c:{}};ALL={m:{members:[],admins:[],...o.m},c:{members:[],admins:null,...o.c}};use(cur())}
function migrate(){let c=false;for(const t of['m','c']){const cr=TRK[t].crit;ALL[t].members.forEach(m=>{while(m.s.length<cr.length){m.s.push(null);c=true}m.s=m.s.map((v,i)=>v==null||!cr[i]?v:Math.min(v,cr[i][1]))})}return c}
async function save(){const j=JSON.stringify(ALL);try{if(db)await db.set({json:j});else localStorage.setItem('ha_db',j);return true}catch(e){toast('تعذر الحفظ: '+e.message);return false}}

async function init(){
 $('#hl').src=LOGO;
 const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.append(l);
 try{S=JSON.parse(sessionStorage.getItem('ha_s'))}catch(e){}
 if(S&&!S.t)S.t='m';try{LT=localStorage.getItem('ha_t')=='c'?'c':'m'}catch(e){}
 if(FB&&typeof firebase!=='undefined'){
  try{
   firebase.initializeApp(FB);db=firebase.firestore().collection('app').doc('humat_alwatan');
   const s=await db.get();if(s.exists)load(JSON.parse(s.data().json));
   db.onSnapshot(s=>{if(s.exists){load(JSON.parse(s.data().json));if(migrate())save();if(!document.activeElement.matches('input,textarea'))render()}});
  }catch(e){db=null;toast('تعذر الاتصال بـ Firebase، سيُستخدم التخزين المحلي')}
 }
 if(!db)try{load(JSON.parse(localStorage.getItem('ha_db')))}catch(e){}
 if(migrate())save();
 DEFH=await H('admin123');
 let ch=false;
 if(!ALL.m.admins.length){ALL.m.admins=[{u:'admin',p:DEFH}];ch=true}
 if(!ALL.c.admins||!ALL.c.admins.length){ALL.c.admins=JSON.parse(JSON.stringify(ALL.m.admins));ch=true}
 if(ch)save();
 render();
}

function render(){
 use(cur());
 if(S){const ok=S.role=='admin'?DB.admins.some(a=>a.u==S.id):DB.members.some(m=>m.id==S.id);if(!ok)S=null}
 $('#out').hidden=!S;$('#who').textContent=!S?'':S.role=='admin'?TRK[TK].name+' - مسؤول: '+S.id:(fm(S.id)||{}).n||'';
 $('#li').hidden=!!S||PG=='login';document.body.dataset.pg=S?'app':PG;
 $('#app').innerHTML=!S?(PG=='login'?loginView():homeView()):S.role=='admin'?adminView():memberView(fm(S.id));
}
function logout(){S=null;PG='home';ERR='';try{sessionStorage.removeItem('ha_s')}catch(e){}render()}
async function go(e){e&&e.preventDefault();
 const u=nd($('#u').value.trim()),p=await H($('#p').value);use(LT);
 const role=DB.admins.some(a=>a.u===u&&a.p===p)?'admin':DB.members.some(m=>m.id===u&&m.p===p)?'member':null;
 if(!role){ERR='اسم المستخدم أو كلمة المرور غير صحيحة';$('.err').textContent=ERR;return}
 ERR='';S={role,id:u,t:LT};try{sessionStorage.setItem('ha_s',JSON.stringify(S))}catch(e){}render();
}

const loginView=()=>`<div class="auth"><aside><img src="${LOGO}" alt="شعار حزب حماة الوطن"><h2>تقييم ${TRK[LT].name}</h2><p>اطّلع على درجاتك في بنود التقييم وترتيبك بين الأمناء.</p></aside>
<div class="fm"><div><button type="button" class="g" onclick="showHome()" style="margin-bottom:14px">العودة للرئيسية</button><h2>تسجيل الدخول</h2><p class="mut">الأمناء: رقم التسجيل وكلمة المرور. المسؤولون: اسم المستخدم وكلمة المرور.</p></div>
<div class="seg" role="tablist" aria-label="نوع الحساب">${['m','c'].map(t=>`<button type="button" role="tab" aria-selected="${t==LT}" class="${t==LT?'on':''}" onclick="setLT('${t}')">${TRK[t].name}</button>`).join('')}</div>
<label>رقم التسجيل أو اسم المستخدم<input id="u" autocomplete="username" onkeydown="if(event.key==='Enter')$('#p').focus()"></label>
<label>كلمة المرور<input id="p" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')go()"></label>
<p class="err" role="alert">${ERR}</p><button type="button" onclick="go()">دخول</button></div></div>`;

function memberView(m){
 const t=tot(m),r=rank(m),n=DB.members.filter(o=>tot(o)!=null).length;
 return `<section class="wrap">
<div class="card hero"><div class="ring" style="--p:${t==null?0:t/MAXT*100}" role="img" aria-label="المجموع ${t??'غير مرصود'} من ${MAXT}"><b>${t??'—'}<small>من ${MAXT}</small></b></div>
<div class="id"><p class="mut">أهلاً بك</p><h2>${esc(m.n)}</h2><p class="mut">رقم التسجيل: <b>${m.id}</b></p><p style="margin:10px 0 0"><button class="g" onclick="print()">طباعة النتيجة</button></p></div>
<dl class="kp"><div><dt>المعدل من 5</dt><dd>${t==null?'—':gpa(t)}</dd></div><div><dt>الترتيب</dt><dd>${r||'—'}<small> من ${n}</small></dd></div></dl></div>
${t==null?'<div class="msg">لم يتم رصد درجاتك بعد. ستظهر هنا بمجرد أن يضيفها المسؤول.</div>':''}
<div class="card"><h3>تفاصيل الدرجات - ${TRK[TK].name}</h3>${CRIT.map((c,i)=>{const v=m.s[i];return `<div class="row"><span>${c[0]}</span><div class="bar"><i${v===c[1]?' class="full"':''} style="width:${v==null?0:v/c[1]*100}%"></i></div><b>${v==null?'—':v} / ${c[1]}</b></div>`}).join('')}</div>
${m.note?`<div class="msg"><b>ملحوظة المسؤول</b><p style="margin:4px 0 0">${esc(m.note)}</p></div>`:''}
</section>`;
}

function adminView(){
 const n=DB.members.length,ev=DB.members.filter(m=>tot(m)!=null),avg=ev.length?Math.round(ev.reduce((a,m)=>a+tot(m),0)/ev.length*10)/10:'—';
 const rows=[...DB.members].sort(byName).map((m,k)=>{const t=tot(m);return `<tr data-id="${m.id}" data-n="${esc(m.n)} ${m.id}"><td class="c1">${k+1}</td><td class="nm c2">${esc(m.n)}<small>${m.id}</small></td>${CRIT.map((c,i)=>`<td><input type="number" min="0" max="${c[1]}" step="any" value="${m.s[i]??''}" aria-label="${esc(m.n)}: ${c[0]}" onchange="setS('${m.id}',${i},this)"></td>`).join('')}<td class="tt">${t??''}</td><td class="gp">${t==null?'':gpa(t)}</td><td class="rk">${rank(m)}</td><td><input class="note" value="${esc(m.note||'')}" aria-label="ملحوظة ${esc(m.n)}" onchange="setN('${m.id}',this.value)"></td><td class="act"><button class="g ic" title="كلمة مرور جديدة" aria-label="كلمة مرور جديدة" onclick="rp('${m.id}')">${IC.key}</button><button class="g ic dg" title="حذف" aria-label="حذف" onclick="del('${m.id}')">${IC.del}</button></td></tr>`}).join('');
 return `<div class="wrap wide">
<h2 style="margin:0">لوحة المسؤول - ${TRK[TK].name}</h2>
${DB.admins.some(a=>a.p===DEFH)?'<div class="msg warn" role="alert"><b>كلمة مرور المسؤول الافتراضية ما زالت مفعّلة.</b> غيّرها من قسم «حسابات المسؤولين» أدناه: اكتب admin وكلمة مرور جديدة ثم احفظ.</div>':''}
${FB?'':'<div class="msg warn">التخزين الحالي محلي: البيانات تُحفظ في هذا المتصفح فقط. لمشاركتها مع بقية المسؤولين والأمناء على أجهزتهم فعّل Firebase.</div>'}
<div class="kpis"><div class="card"><span>عدد الأمناء</span><b>${n}</b></div><div class="card"><span>تم تقييمهم</span><b>${ev.length}<small> من ${n}</small></b></div><div class="card"><span>متوسط المجموع</span><b>${avg}<small> من ${MAXT}</small></b></div></div>
<div class="card"><h3>إضافة أمناء</h3><p class="mut" style="margin:4px 0 10px">اكتب اسم الأمين، أو عدة أسماء كل اسم في سطر، وسيُولَّد لكل أمين رقم تسجيل وكلمة مرور.</p>
<textarea id="nn" rows="2" aria-label="أسماء الأمناء"></textarea>
<p style="margin-bottom:0"><button onclick="addM()">إضافة وتوليد رقم التسجيل</button></p></div>
<div class="card"><div class="tools"><h3>الأمناء (${n})</h3><input type="search" placeholder="بحث بالاسم أو الرقم" aria-label="بحث" oninput="flt(this.value)"><span style="flex:1"></span><button class="g" onclick="csv()">تصدير إلى Excel</button><button class="g" onclick="bk()">نسخة احتياطية</button><button class="g" onclick="$('#rf').click()">استعادة نسخة</button><input id="rf" type="file" accept=".json" hidden onchange="rs(this)"></div>
<div class="tw"><table><thead><tr><th class="c1">#</th><th class="c2">الاسم</th>${CRIT.map(c=>`<th>${c[0]}<br><small>من ${c[1]}</small></th>`).join('')}<th>المجموع</th><th>المعدل</th><th>الترتيب</th><th>ملحوظة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
${n?'':'<p class="mut" style="margin-top:12px">لا يوجد أمناء بعد. أضف أول اسم من قسم «إضافة أمناء».</p>'}</div>
<div class="card"><h3>حسابات مسؤولي ${TRK[TK].name}</h3><div class="chips">${DB.admins.map(a=>`<span class="chip">${esc(a.u)}${a.u===S.id?' <small class="mut">(أنت)</small>':`<button class="g" title="حذف هذا المسؤول" aria-label="حذف هذا المسؤول" data-u="${esc(a.u)}" onclick="delA(this.dataset.u)">${IC.del}</button>`}</span>`).join('')}</div>
<p class="mut">لإضافة مسؤول اكتب اسماً جديداً وكلمة مرور، ولتغيير كلمة مرور مسؤول موجود اكتب اسمه وكلمة مرور جديدة (6 أحرف على الأقل).</p>
<div class="tools" style="margin-top:12px"><input id="au" placeholder="اسم المستخدم" aria-label="اسم المستخدم" style="max-width:200px"><input id="ap" type="password" placeholder="كلمة المرور" aria-label="كلمة المرور" style="max-width:200px"><button onclick="addA()">حفظ</button></div></div></div>`;
}

function calc(){DB.members.forEach(m=>{const r=document.querySelector(`tr[data-id="${m.id}"]`);if(!r)return;const t=tot(m);r.querySelector('.tt').textContent=t??'';r.querySelector('.gp').textContent=t==null?'':gpa(t);r.querySelector('.rk').textContent=rank(m)})}
function setS(id,i,el){const v=el.value===''?null:Math.min(CRIT[i][1],Math.max(0,+el.value));el.value=v??'';fm(id).s[i]=v;calc();save()}
function setN(id,v){fm(id).note=v;save()}
function flt(q){q=q.trim();document.querySelectorAll('tbody tr').forEach(r=>r.hidden=!r.dataset.n.includes(q))}
async function copyCreds(b){
 const ta=$('#dc'),t=ta.value;let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
 if(!ok)try{ta.focus();ta.select();ta.setSelectionRange(0,t.length);ok=document.execCommand('copy')}catch(e){}
 if(!ok){ta.focus();ta.select()}
 b.textContent=ok?'تم النسخ ✓':'تعذّر النسخ تلقائياً: النص محدد، اضغط Ctrl+C'
}
function creds(a,p){$('#dc').value=a.map(x=>x.join('\t')).join('\n');$('#cp').textContent='نسخ';const st=$('#ds');st.dataset.d='';st.textContent=p?'جارٍ حفظ البيانات على الخادم... لا تغلق الصفحة حتى تظهر عبارة «تم الحفظ ✓».':'';clearTimeout(creds.k);if(p)creds.k=setTimeout(()=>{if(!st.dataset.d)st.textContent='الحفظ بطيء، تأكد من اتصال الإنترنت وانتظر قبل إغلاق النافذة.'},12000);const d=$('#dlg');try{d.showModal()}catch(e){d.setAttribute('open','')}}
function dst(ok){clearTimeout(creds.k);const st=$('#ds');st.dataset.d='1';st.textContent=ok?'تم الحفظ ✓':'تعذّر حفظ البيانات على الخادم. تأكد من اتصال الإنترنت وكرّر العملية قبل إرسال البيانات.'}
function closeD(){const d=$('#dlg');d.close?d.close():d.removeAttribute('open')}
async function addM(){
 const ns=$('#nn').value.split('\n').map(x=>x.trim()).filter(Boolean);
 if(!ns.length)return toast('اكتب اسمًا واحدًا على الأقل');
 const out=[];
 for(const n of ns){const p=pw(),id=newId();DB.members.push({id,n,p:await H(p),s:Array(CRIT.length).fill(null),note:''});out.push([n,id,p])}
 render();creds(out,1);dst(await save());
}
async function rp(id){const m=fm(id),p=pw();m.p=await H(p);creds([[m.n,id,p]],1);dst(await save())}
async function del(id){const m=fm(id);if(confirm('حذف '+m.n+' نهائيًا؟')){DB.members=DB.members.filter(x=>x!==m);render();await save()}}
async function delA(u){
 if(DB.admins.length<2)return toast('لا يمكن حذف آخر مسؤول');
 if(u===S.id)return toast('لا يمكنك حذف الحساب الذي تستخدمه الآن');
 if(!confirm('حذف المسؤول «'+u+'» نهائياً؟'))return;
 DB.admins=DB.admins.filter(a=>a.u!==u);render();toast('تم حذف المسؤول');await save();
}
async function addA(){
 const u=$('#au').value.trim(),p=$('#ap').value;
 if(!u||p.length<6)return toast('اكتب اسم مستخدم وكلمة مرور من 6 أحرف على الأقل');
 const h=await H(p),a=DB.admins.find(x=>x.u===u);
 if(a)a.p=h;else DB.admins.push({u,p:h});
 await save();render();toast('تم الحفظ');
}
function dl(t,n,y){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y+';charset=utf-8'}));a.download=n;a.click()}
function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const h=['رقم التسجيل','الاسم',...CRIT.map(c=>c[0]),'المجموع','المعدل','الترتيب','ملحوظة'];
 const r=[...DB.members].sort(byName).map(m=>{const t=tot(m);return[m.id,m.n,...m.s,t,t==null?'':gpa(t),rank(m),m.note||''].map(q).join(',')});
 dl('\ufeff'+[h.map(q).join(','),...r].join('\r\n'),'تقييم-'+TRK[TK].name.replace(' ','-')+'.csv','text/csv');
}
const bk=()=>dl(JSON.stringify({...DB,t:TK}),'backup-'+TK+'.json','application/json');
function rs(el){const f=el.files[0];if(!f)return;f.text().then(async t=>{try{const d=JSON.parse(t);if(!Array.isArray(d.members)||!Array.isArray(d.admins))throw 0;if(d.t&&d.t!==TK)return toast('هذه النسخة تخص '+TRK[d.t].name);delete d.t;ALL[TK]=d;use(TK);await save();render();toast('تمت الاستعادة')}catch(e){toast('ملف غير صالح')}})}
init();
</script>
</body>
</html>
